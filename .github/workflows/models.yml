# Converts, vets and tests the models in models/catalogue.json, then
# releases them as models-<date> with a build attestation. DevKit's
# publishing verifies the attestation against this workflow
# (--signer-workflow …/models.yml --source-ref refs/heads/main
# --deny-self-hosted-runners), mirrors the files to its own server and signs
# them into its manifest.
#
# Speech models are converted and quantized here from upstream files pinned
# by commit and SHA-256, and released as assets (each under 2 GiB). The Qwen
# GGUFs stay on Hugging Face, pinned by commit, SHA-256 and size; they're
# checked and tested but never changed. Every model's licence must be on the
# allowlist. Tests run on the CPU (hosted runners have no GPU), and each
# model's test level is recorded in catalogue.json.
#
# Runs when catalogue.json changes on main, and by hand. A run by hand can
# name models to test (only), which releases nothing.

name: Models

on:
  push:
    branches: [main]
    paths: [models/catalogue.json]
  workflow_dispatch:
    inputs:
      only:
        description: Model ids to test, comma-separated (releases nothing)
        type: string
        default: ""

permissions:
  contents: read

# Its own group: a models run never waits for, or races, a Build run.
concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      speech: ${{ steps.plan.outputs.speech }}
      chat: ${{ steps.plan.outputs.chat }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          ONLY: ${{ inputs.only || '' }}
        run: |
          set -euo pipefail
          python3 -m doctest scripts/models.py scripts/speech_check.py scripts/model_updates.py
          for kind in speech chat; do
            ids="$(python3 scripts/models.py ids "$kind" | python3 -c '
          import json, os, sys
          ids = json.load(sys.stdin)
          only = [i.strip() for i in os.environ["ONLY"].split(",") if i.strip()]
          print(json.dumps([i for i in ids if not only or i in only]))')"
            echo "$kind=$ids" | tee -a "$GITHUB_OUTPUT"
          done

  # The CPU tools at the engine pins, built once for every model job.
  tools:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: scripts/models.sh tools tools && tar -czf tools.tar.gz tools
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools.tar.gz
          retention-days: 1

  speech:
    needs: [plan, tools]
    if: needs.plan.outputs.speech != '[]'
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.speech) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Make room
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          # The runner's second disk has the most room, when there is one.
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail "$RUNNER_TEMP" | tail -1)" ]; then
            sudo mkdir -p /mnt/models && sudo chown "$USER" /mnt/models
            echo "MODELS_WORK=/mnt/models" >> "$GITHUB_ENV"
          else
            echo "MODELS_WORK=$RUNNER_TEMP/models" >> "$GITHUB_ENV"
          fi
          df -h / /mnt 2>/dev/null || df -h /
      - uses: actions/download-artifact@v8
        with:
          name: tools
      - name: Convert and test ${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          tar -C "$MODELS_WORK" -xzf tools.tar.gz
          scripts/models.sh ${{ matrix.id }} out "$MODELS_WORK/tools"
      - uses: actions/upload-artifact@v7
        with:
          name: model-${{ matrix.id }}
          path: out/*
          # Only handed to the release job; the release keeps the files.
          retention-days: 1

  chat:
    needs: [plan, tools]
    if: needs.plan.outputs.chat != '[]'
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.chat) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Make room
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          # The runner's second disk has the most room, when there is one.
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail "$RUNNER_TEMP" | tail -1)" ]; then
            sudo mkdir -p /mnt/models && sudo chown "$USER" /mnt/models
            echo "MODELS_WORK=/mnt/models" >> "$GITHUB_ENV"
          else
            echo "MODELS_WORK=$RUNNER_TEMP/models" >> "$GITHUB_ENV"
          fi
          df -h / /mnt 2>/dev/null || df -h /
      - uses: actions/download-artifact@v8
        with:
          name: tools
      - name: Check and test ${{ matrix.id }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          tar -C "$MODELS_WORK" -xzf tools.tar.gz
          scripts/models.sh ${{ matrix.id }} out "$MODELS_WORK/tools"
      - uses: actions/upload-artifact@v7
        with:
          name: model-${{ matrix.id }}
          path: out/*
          # Only handed to the release job; the release keeps the files.
          retention-days: 1


  release:
    needs: [plan, speech, chat]
    # Every model must pass: a release is the whole catalogue.
    if: github.ref == 'refs/heads/main' && (inputs.only || '') == '' && needs.speech.result == 'success' && needs.chat.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: model-*
          path: results
          merge-multiple: true
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="models-$(date -u +%Y-%m-%d)"
          # A second release on the same day gets the run number.
          if gh release view "$tag" >/dev/null 2>&1; then tag="$tag-$GITHUB_RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: scripts/models.sh catalogue results release ${{ steps.tag.outputs.tag }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.gguf
            release/*.NOTICE.txt
            release/catalogue.json
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create "$TAG" --title "$TAG" --latest=false \
            --notes "Models from models/catalogue.json at $GITHUB_SHA, converted and tested by $run_url. The Qwen GGUFs stay on Hugging Face; catalogue.json pins them. Verify a file with: gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/models.yml --source-ref refs/heads/main --deny-self-hosted-runners. Licences: each model's NOTICE.txt, and LICENSES.md." \
            release/*
