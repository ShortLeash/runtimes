# Builds static PHP with more extensions, PHP extensions for Windows PHP,
# relocatable Ruby, pgvector for each Postgres version DevKit installs,
# memcached, MariaDB and PostGIS for macOS, libwebrtc (without H.264) and the
# local AI engines (transcribe.cpp and llama.cpp) for DevKit, and attaches
# them to this repository's releases with a build attestation. DevKit's own
# publishing verifies each file against that attestation before it signs and
# serves it. MariaDB and PostGIS releases also carry the GPL sources they were
# built from (the sources job).
#
# Every day it builds each PHP patch release php.net has published that isn't
# released here yet. Run it by hand (Actions › Build › Run workflow) for a new
# Ruby, pgvector, memcached, MariaDB or PostGIS release, or to rebuild
# everything. libwebrtc builds only when asked for by name (what: libwebrtc);
# it takes an hour or two. The voice engines build only when asked for by
# name too (what: voice-engines), after their pins change. So do the PHP
# extensions for Windows (what: php-ext-windows), which build only the files
# not released yet. Only runs on main attach files to releases; a run on
# another branch only builds.

name: Build

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: What to build
        type: choice
        options: [all, php, ruby, pgvector, memcached, libwebrtc, voice-engines, php-ext-windows, mariadb, postgis]
        default: all
      platform:
        description: Which runners (one platform keeps a test run off the others)
        type: choice
        options: [all, macos, windows]
        default: all

permissions:
  contents: read

# One run at a time per branch, so two runs never upload to the same release
# at once (only main releases); a test run on a branch doesn't wait for main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# DevKit supports macOS 13, so every build targets it, whatever macOS the
# runner runs. The scripts check each binary they ship against it.
env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  # PHP versions to build.
  PHP_MINORS: "8.2 8.3 8.4 8.5"
  # PHP versions to build Windows extensions for (php-ext-windows).
  PHP_WINDOWS_MINORS: "8.0 8.1 8.2 8.3 8.4 8.5"

# Runners (actions/runner-images): macos-15 is Apple silicon; macos-15-intel
# is x86_64, the last Intel image GitHub provides (until about August 2027).

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To keep the schedule on: GitHub turns off scheduled workflows in a
      # public repository after 60 days without activity.
      actions: write
    outputs:
      php: ${{ steps.plan.outputs.php }}
      ruby: ${{ steps.plan.outputs.ruby }}
      pgvector: ${{ steps.plan.outputs.pgvector }}
      memcached: ${{ steps.plan.outputs.memcached }}
      libwebrtc: ${{ steps.plan.outputs.libwebrtc }}
      voice_engines: ${{ steps.plan.outputs.voice_engines }}
      php_ext_windows: ${{ steps.plan.outputs.php_ext_windows }}
      mariadb: ${{ steps.plan.outputs.mariadb }}
      postgis: ${{ steps.plan.outputs.postgis }}
      postgis_windows: ${{ steps.plan.outputs.postgis_windows }}
      sources: ${{ steps.plan.outputs.sources }}
      mac_runners: ${{ steps.plan.outputs.mac_runners }}
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          WHAT: ${{ inputs.what || 'scheduled' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          PHP_WINDOWS_MINORS: ${{ env.PHP_WINDOWS_MINORS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m doctest scripts/plan.py scripts/tag.py
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].assets[].name' > published.txt
          python3 scripts/plan.py "$WHAT" published.txt $PHP_MINORS | tee -a "$GITHUB_OUTPUT"
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/enable"

  php:
    needs: plan
    if: needs.plan.outputs.php != '[]'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.mac_runners) }}
        php: ${{ fromJSON(needs.plan.outputs.php) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build PHP ${{ matrix.php }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/php.sh ${{ matrix.php }} out
      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php }}-${{ matrix.runner }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  ruby:
    needs: plan
    if: needs.plan.outputs.ruby == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build Ruby ${{ matrix.ruby }}
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ruby.sh ${{ matrix.ruby }} out
      - name: Repackage RubyInstaller's Ruby ${{ matrix.ruby }}
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh scripts/ruby-windows.ps1 ${{ matrix.ruby }} out
      - uses: actions/upload-artifact@v7
        with:
          name: ruby-${{ matrix.ruby }}-${{ matrix.runner }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  pgvector:
    needs: plan
    if: needs.plan.outputs.pgvector == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
        # Every PostgreSQL version DevKit installs. DevKit's publishing checks
        # that the newest pgvector release has all of them.
        postgres: ["18.6.0", "17.11.0", "16.15.0", "15.19.0", "14.24.0"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build pgvector for Postgres ${{ matrix.postgres }}
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/pgvector.sh ${{ matrix.postgres }} out
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build pgvector for Postgres ${{ matrix.postgres }}
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh scripts/pgvector.ps1 ${{ matrix.postgres }} out
      - uses: actions/upload-artifact@v7
        with:
          name: pgvector-${{ matrix.postgres }}-${{ matrix.runner }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  memcached:
    needs: plan
    if: needs.plan.outputs.memcached == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.mac_runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build memcached
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/memcached.sh out
      - uses: actions/upload-artifact@v7
        with:
          name: memcached-${{ matrix.runner }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  libwebrtc:
    needs: plan
    if: needs.plan.outputs.libwebrtc != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.libwebrtc) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      # A WebRTC checkout and build need about 30 GB; the runner image's
      # Android SDK, spare Xcodes and simulators make room.
      - name: Make room
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/.ghcup" || true
          current="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$current" ] || sudo rm -rf "$x"
          done
          xcrun simctl delete all >/dev/null 2>&1 || true
          sudo rm -rf /Library/Developer/CoreSimulator/Images/* "$HOME/Library/Developer/CoreSimulator/Caches" || true
          df -h /
      - name: Build libwebrtc ${{ matrix.arch }}
        if: matrix.os == 'macos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/libwebrtc.sh ${{ matrix.arch }} out
      # Chromium's checkout has paths longer than Windows' default limit.
      - name: Allow long paths
        if: matrix.os == 'windows'
        run: git config --system core.longpaths true
      - name: Build libwebrtc ${{ matrix.arch }}
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          # The runner's D: drive has the room; C: doesn't.
          LIBWEBRTC_WORK: ${{ runner.temp }}\libwebrtc
        run: ./scripts/libwebrtc-windows.ps1 ${{ matrix.arch }} out
      - uses: actions/upload-artifact@v7
        with:
          name: libwebrtc-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  voice-engines:
    needs: plan
    if: needs.plan.outputs.voice_engines != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.voice_engines) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build the voice engines for ${{ matrix.arch }}
        if: matrix.os == 'macos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/voice-engines.sh ${{ matrix.arch }} out
      # cl.exe, link.exe and dumpbin on PATH for the build and smoke tests.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
      - name: Build the voice engines for ${{ matrix.arch }}
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          # A short folder on the runner's D: drive: ggml's Vulkan shaders
          # have deep paths.
          VOICE_ENGINES_WORK: ${{ runner.temp }}\ve
        run: ./scripts/voice-engines-windows.ps1 ${{ matrix.arch }} out
      - uses: actions/upload-artifact@v7
        with:
          name: voice-engines-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  php-ext-windows:
    needs: plan
    if: needs.plan.outputs.php_ext_windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.php_ext_windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      # The compiler the minor's PHP was built with: Visual Studio 2022's own
      # for vs17, its 14.29 toolset (Visual Studio 2019's) for vs16.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ matrix.toolset }}
      - name: Build ${{ matrix.exts }} for PHP ${{ matrix.minor }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/php-ext-windows.ps1 -Minor ${{ matrix.minor }} -Exts "${{ matrix.exts }}" -Out out
      - uses: actions/upload-artifact@v7
        with:
          name: php-ext-windows-${{ matrix.minor }}-${{ matrix.group }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  mariadb:
    needs: plan
    if: needs.plan.outputs.mariadb == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.mac_runners) }}
        # DevKit's two MariaDB series; the pins are in scripts/mariadb.env.
        mariadb: ["11.8", "10.11"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build MariaDB ${{ matrix.mariadb }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/mariadb.sh ${{ matrix.mariadb }} out
      - uses: actions/upload-artifact@v7
        with:
          name: mariadb-${{ matrix.mariadb }}-${{ matrix.runner }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  postgis:
    needs: plan
    if: needs.plan.outputs.postgis == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.mac_runners) }}
        # Every PostgreSQL version DevKit installs; DevKit's publishing checks it
        postgres: ["18.6.0", "17.11.0", "16.15.0", "15.19.0", "14.24.0"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # protoc-c writes PostGIS's vector tile and Geobuf code at build time;
      # nothing links Homebrew's library (the script checks).
      - name: Install protoc-c
        run: brew install protobuf-c
      - name: Build PostGIS for Postgres ${{ matrix.postgres }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/postgis.sh ${{ matrix.postgres }} out
      - uses: actions/upload-artifact@v7
        with:
          name: postgis-${{ matrix.postgres }}-${{ matrix.runner }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  # The complete sources of the GPL builds, attached to their releases (GPLv2
  # section 3(a)): one job per thing, so each sources file comes from exactly
  # one job.
  sources:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    strategy:
      fail-fast: false
      matrix:
        what: ${{ fromJSON(needs.plan.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Collect the ${{ matrix.what }} sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/sources.sh ${{ matrix.what }} out
      - uses: actions/upload-artifact@v7
        with:
          name: sources-${{ matrix.what }}
          path: out/*
          # Only handed to the release job; the releases keep the files.
          retention-days: 1

  release:
    needs: [plan, php, ruby, pgvector, memcached, libwebrtc, voice-engines, php-ext-windows, mariadb, postgis, sources]
    # Release what built; a build that failed or timed out keeps its last
    # release. A run that was cancelled releases nothing.
    if: >-
      ${{ !cancelled()
        && github.ref == 'refs/heads/main'
        && (needs.php.result != 'skipped' || needs.ruby.result != 'skipped' || needs.pgvector.result != 'skipped' || needs.memcached.result != 'skipped' || needs.libwebrtc.result != 'skipped' || needs['voice-engines'].result != 'skipped' || needs['php-ext-windows'].result != 'skipped' || needs.mariadb.result != 'skipped' || needs.postgis.result != 'skipped' || needs.sources.result != 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: outputs
          merge-multiple: true
      - id: any
        run: |
          set -euo pipefail
          ls -la outputs || true
          if [ -n "$(ls -A outputs 2>/dev/null)" ]; then echo "files=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/attest-build-provenance@v4
        if: steps.any.outputs.files == 'true'
        with:
          subject-path: outputs/*
      - name: Attach to releases
        if: steps.any.outputs.files == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 scripts/tag.py outputs | while read -r tag file; do
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "$tag" --latest=false \
                --notes "Built by $run_url. Verify a file with: gh attestation verify <file> --repo $GITHUB_REPOSITORY. Licences: see LICENSES.md."
            fi
            # A rebuild of the same version replaces its files.
            gh release upload "$tag" "$file" --clobber
          done
